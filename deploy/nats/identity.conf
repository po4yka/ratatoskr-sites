# Merge this public-nkey identity into the host NATS `authorization.users` list. The deployed ACL
# is `deploy/nats/ratatoskr.conf` in ratatoskr-platform, and this stanza is the copy of its SITES
# entry (workspace change add-site-publications, spec fleet-bus-topology). Platform adds the entry
# in that change (group 6); until then this file is the proposal that Platform copies. The seed
# stays in `/etc/ratatoskr/sites.nkey`, named by `RATATOSKR__BUS__NKEY_SEED_PATH`; replace only the
# non-secret public-key placeholder.
#
# Sites consumes four durables that Edge creates: `ratatoskr_sites_release_builds` on
# `ratatoskr_commands`, and `ratatoskr_sites_note_changes`, `ratatoskr_sites_vault_disconnections`
# and `ratatoskr_sites_approvals` on `ratatoskr_events`. For each it may read the durable's info,
# pull its next messages and acknowledge them, and it cannot create a consumer. It publishes its
# release event and the shared operation-report subject, and no command. The report subject is
# trusted only by its envelope `producer` field: every identity that may publish it can forge a
# report for another producer, and the lane of the kind `sites.release.build` limits what Platform
# applies (spec fleet-bus-topology). A denied publish is visible only in the NATS server log as a
# `Publish Violation`; the client sees a missing PubAck. The identity subscribes only to its own
# inbox prefix, `_INBOX_sites`.
{
    nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_SITES_XXXXXXXX
    permissions: {
        publish: {
            allow: [
                "evt.sites.release.published.v1",
                "evt.platform.operation.reported.v1",
                "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_sites_release_builds",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_sites_release_builds",
                "$JS.ACK.ratatoskr_commands.ratatoskr_sites_release_builds.>",
                "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_sites_note_changes",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_sites_note_changes",
                "$JS.ACK.ratatoskr_events.ratatoskr_sites_note_changes.>",
                "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_sites_vault_disconnections",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_sites_vault_disconnections",
                "$JS.ACK.ratatoskr_events.ratatoskr_sites_vault_disconnections.>",
                "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_sites_approvals",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_sites_approvals",
                "$JS.ACK.ratatoskr_events.ratatoskr_sites_approvals.>",
            ]
        }
        subscribe: { allow: ["_INBOX_sites.>"] }
    }
}

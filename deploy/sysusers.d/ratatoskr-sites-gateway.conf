# systemd-sysusers(8) entries of ratatoskr-sites-gateway, installed as
# /usr/lib/sysusers.d/ratatoskr-sites-gateway.conf.
#
# The system user of the gateway and its own group. The user has no home and no shell.
#Type Name                    ID GECOS                     Home directory Shell
u     ratatoskr-sites-gateway -  "Ratatoskr sites gateway" -              -
#
# The read group of the sites tree (workspace change add-site-gateway-hosting). The host role of
# ratatoskr-workspace creates it and the setgid root /mnt/nvme/ratatoskr/sites; this file only joins
# it. The unit names it in SupplementaryGroups= as well.
m     ratatoskr-sites-gateway ratatoskr-sites-bundles

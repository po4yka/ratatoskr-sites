# systemd-sysusers(8) entries of ratatoskr-sites, installed as /usr/lib/sysusers.d/ratatoskr-sites.conf.
#
# The system user of the service and its own group. The user has no home and no shell.
#Type Name            ID                    GECOS             Home directory Shell
u     ratatoskr-sites -                     "Ratatoskr Sites" -              -
#
# The read group of the notes blob root (workspace change add-site-publications, design D3). The
# root /mnt/nvme/ratatoskr/blobs/ratatoskr-notes is mode 2750 and each note blob 0640 with this
# group, so the service can read a note and never write one. ratatoskr-notes owns the group: the
# deploy role of ratatoskr-workspace creates it, the setgid root and the umask (OBS-023). This file
# only joins the group and has no `g` line for it. Note that an `m` line makes systemd-sysusers
# create a group that does not exist yet (sysusers.d(5)); the deploy role then finds the group and
# uses it for the root, so the name stays the one that notes expects.
m     ratatoskr-sites ratatoskr-notes-blobs

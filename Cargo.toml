[workspace]
resolver = "3"
members = [
    "crates/manifest",
    "crates/persistence",
    "crates/publications",
    "crates/release",
    "services/sites",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97"                       # equals the pinned toolchain; no MSRV promise we cannot check
license      = "BSD-3-Clause"
repository   = "https://github.com/po4yka/ratatoskr-sites"

[workspace.dependencies]
# ---- in-repo ----
ratatoskr-sites-manifest     = { version = "0.1.0", path = "crates/manifest" }
ratatoskr-sites-persistence  = { version = "0.1.0", path = "crates/persistence" }
ratatoskr-sites-publications = { version = "0.1.0", path = "crates/publications" }
ratatoskr-sites-release      = { version = "0.1.0", path = "crates/release" }

# ---- fleet contracts ----
# One revision for every `ratatoskr-*` git dependency: Cargo treats two revisions of one git
# repository as two different crates, so a mixed pin would split the shared types in two.
# 2c726027 is the one contracts revision of the whole fleet (workspace check
# every_rust_repository_resolves_one_contracts_revision). It holds `ratatoskr-sites-contracts`
# (SITE-025, group 3): `sites/site-manifest.v1`, `sites/release.v1`, `sites/page.v1` and the site
# messages.
ratatoskr-identifiers     = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "2c726027da79e0e899ad482afead0a2000b03e61" }
ratatoskr-sites-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "2c726027da79e0e899ad482afead0a2000b03e61" }
# The two notes events that the sites service consumes: `notes.file.changed.v1` and
# `notes.vault.disconnected.v1` (workspace spec site-publications).
ratatoskr-notes-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "2c726027da79e0e899ad482afead0a2000b03e61" }
# The envelope of the outbox rows, and the operation report `platform.operation.reported.v1` of a
# build (workspace spec site-publications, "A build is one operation of the sites lane").
ratatoskr-event-envelope      = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "2c726027da79e0e899ad482afead0a2000b03e61" }
ratatoskr-error-contracts     = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "2c726027da79e0e899ad482afead0a2000b03e61" }
ratatoskr-operation-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "2c726027da79e0e899ad482afead0a2000b03e61" }

# ---- persistence ----
# No `migrate` feature: the schema is one file, `include_str!`d into the binary by
# `ratatoskr-sites-persistence`, so a deployment cannot drift from its schema and there is no
# ledger to record (development status: no migrations; a schema change edits `schema.sql` in place).
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio", "tls-rustls-ring", "postgres", "uuid",
] }

# ---- async runtime and HTTP ----
tokio = { version = "1.46", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "fs", "io-util"] }
axum  = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }

# The HTTP client of the notes internal index route, on loopback. The versions of
# ratatoskr-platform.
http-body-util = "0.1.5"
hyper          = { version = "1.11.0", features = ["client", "http1"] }
hyper-util     = { version = "0.1.20", features = ["client-legacy", "tokio", "http1"] }

# ---- paths ----
# The path key of ratatoskr-notes: NFC, then Unicode default case folding. A publication compares
# folders with it, so `Private` excludes `private/x.md` as it does in notes. The versions of
# ratatoskr-notes.
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"] }
caseless = "0.2.2"

# ---- the release builder ----
# CommonMark with tables, strikethrough, task lists and wikilinks, the version of ratatoskr-notes.
# The release builder parses each selected note into one tree, and the privacy filter runs on it.
pulldown-cmark = { version = "0.13.4", default-features = false }
# The tokenizer of the HTML standard, for the closed element and attribute allowlist of the HTML
# body of a page (workspace spec site-release-privacy, "Rendered HTML is sanitised"). It reads the
# markup as a browser does, so a fragment cannot hide an element from the allowlist. Not ammonia:
# ammonia 4.1 and later depend on cssparser (MPL-2.0, not in deny.toml), and 4.0 has open
# RustSec advisories.
html5ever = "0.40"

# The RFC 8785 (JCS) form of the release document, whose SHA-256 is the release id (workspace
# design D4).
serde_jcs = "0.2"

# ---- note bytes ----
# The fresh SHA-256 of a note blob before it is used (workspace spec blob-references). RustCrypto,
# pure Rust; sqlx already depends on it.
sha2 = { version = "0.10", default-features = false, features = ["std"] }

# ---- the site manifest ----
# `ratatoskr-site.toml` (contract `sites/site-manifest.v1`). The version of ratatoskr-contracts.
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

# ---- the bus ----
# The outbox relay publishes to JetStream under the SITES identity, with its own inbox prefix
# (workspace spec fleet-bus-topology). The version of ratatoskr-notes.
async-nats = "0.50.0"
# The stop of the relay when the process stops.
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# The message stream of a pull consumer. The version of ratatoskr-notes.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# ---- configuration ----
figment = { version = "0.10", features = ["env"] }
secrecy = { version = "0.10", features = ["serde"] }

# ---- telemetry ----
tracing            = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "env-filter", "fmt", "json", "ansi"] }
metrics-exporter-prometheus = { version = "0.17", default-features = false }

# ---- identifiers, serialization and errors ----
uuid       = { version = "1.11", features = ["v4", "v7", "serde"] }   # v4: the random source_ref of a note
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "2.0"

# ---- dev only ----
tempfile = "3"
# `oneshot` on the domain router in the route tests. The version of ratatoskr-notes.
tower = { version = "0.5", default-features = false, features = ["util"] }

[workspace.lints.rust]
unsafe_code                   = "forbid"
missing_docs                  = "deny"
missing_debug_implementations = "deny"
unreachable_pub               = "deny"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
unwrap_used        = "deny"
expect_used        = "deny"
panic              = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
dbg_macro          = "deny"
todo               = "deny"
print_stdout       = "deny"     # startup failures go to stderr; a stray println bypasses the subscriber
# `panic`, `unwrap_used` and `expect_used` close every EXPLICIT panic path and leave the most
# common implicit one open. Both are `allow` by default and in `clippy::restriction`, so
# `pedantic` does not enable them.
indexing_slicing   = "deny"     # `v[i]` and `&s[a..b]` panicking out of bounds
string_slice       = "deny"     # `&s[..n]` panicking because n is not a UTF-8 char boundary

# Release profile: `panic` is left at the default `unwind` ON PURPOSE, so a caught handler panic
# can render as a response rather than aborting the process with no diagnostics.
[profile.release]
debug = 1          # line tables only: a usable backtrace in the ERROR log, no full debuginfo

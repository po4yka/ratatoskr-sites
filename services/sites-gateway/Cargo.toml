[package]
name        = "ratatoskr-sites-gateway"
description = "The Ratatoskr sites gateway: serves the current deploy of each approved site on its hostname and forwards the site's own API calls to Edge."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "ratatoskr-sites-gateway"
path = "src/main.rs"

[dependencies]
ratatoskr-error-contracts.workspace   = true
ratatoskr-identifiers.workspace       = true
ratatoskr-sites-contracts.workspace   = true
axum.workspace                        = true
figment.workspace                     = true
metrics-exporter-prometheus.workspace = true
serde.workspace                       = true
serde_json.workspace                  = true
thiserror.workspace                   = true
tokio.workspace                       = true
tokio-util.workspace                  = true
tracing.workspace                     = true
tracing-subscriber.workspace          = true

[dev-dependencies]
sha2.workspace     = true
tempfile.workspace = true
tower.workspace    = true

[lints]
workspace = true

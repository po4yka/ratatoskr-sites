[package]
name        = "ratatoskr-sites-gateway"
description = "The Ratatoskr sites gateway: serves the current deploy of each approved site on its hostname and forwards the site's own API calls to Edge."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "ratatoskr-sites-gateway"
path = "src/main.rs"

[dependencies]
ratatoskr-error-contracts.workspace   = true
ratatoskr-identifiers.workspace       = true
ratatoskr-sites-contracts.workspace   = true
axum.workspace                        = true
figment.workspace                     = true
futures-util.workspace                = true
hyper-util.workspace                  = true
metrics-exporter-prometheus.workspace = true
percent-encoding.workspace            = true
serde.workspace                       = true
serde_json.workspace                  = true
thiserror.workspace                   = true
tokio.workspace                       = true
tokio-util                            = { workspace = true, features = ["io"] }
tracing.workspace                     = true
tracing-subscriber.workspace          = true

[dev-dependencies]
http-body-util.workspace = true
sha2.workspace           = true
# `start_paused` for the test of a two-minute stream.
tokio                    = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tower.workspace    = true

[lints]
workspace = true

[package]
name        = "ratatoskr-sites"
description = "The Ratatoskr Sites deployable: publications, releases and the Content Delivery API."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "ratatoskr-sites"
path = "src/main.rs"

[dependencies]
ratatoskr-sites-manifest.workspace    = true
ratatoskr-sites-persistence.workspace = true
ratatoskr-identifiers.workspace       = true
ratatoskr-event-envelope.workspace    = true
ratatoskr-error-contracts.workspace   = true
ratatoskr-operation-contracts.workspace = true
ratatoskr-sites-contracts.workspace   = true
ratatoskr-notes-contracts.workspace   = true
ratatoskr-sites-publications.workspace = true
ratatoskr-sites-release.workspace     = true
async-nats.workspace                  = true
axum.workspace                        = true
figment.workspace                     = true
futures-util.workspace                = true
http-body-util.workspace              = true
hyper.workspace                       = true
hyper-util.workspace                  = true
metrics-exporter-prometheus.workspace = true
secrecy.workspace                     = true
serde.workspace                       = true
serde_json.workspace                  = true
serde_jcs.workspace                   = true
sha2.workspace                        = true
sqlx.workspace                        = true
thiserror.workspace                   = true
tokio.workspace                       = true
tokio-util.workspace                  = true
tracing.workspace                     = true
tracing-subscriber.workspace          = true
uuid.workspace                        = true

[features]
# Test-only seams: Servable::pause_next_refresh and ReleaseBuilder::pause_before_lock. Never
# compiled into the service binary.
test-support = []

[dev-dependencies]
ratatoskr-sites              = { path = ".", features = ["test-support"] }
ratatoskr-sites-persistence  = { workspace = true, features = ["test-support"] }
ratatoskr-sites-publications = { workspace = true, features = ["test-support"] }
nkeys.workspace              = true
tar.workspace                = true
tempfile.workspace           = true
tower.workspace              = true

[lints]
workspace = true

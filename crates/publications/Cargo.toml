[package]
name        = "ratatoskr-sites-publications"
description = "The notes index that a publication reads, the selection of a publication and the slug of a page."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
ratatoskr-identifiers.workspace     = true
ratatoskr-sites-contracts.workspace = true
caseless.workspace                  = true
serde.workspace                     = true
serde_json.workspace                = true
thiserror.workspace                 = true
unicode-normalization.workspace     = true
sha2                                = { workspace = true, optional = true }

[features]
# Test-only scaffolding: the loader of a fixture vault. Never compiled into a service binary.
test-support = ["dep:sha2"]

[dev-dependencies]
ratatoskr-sites-publications = { path = ".", features = ["test-support"] }

[lints]
workspace = true

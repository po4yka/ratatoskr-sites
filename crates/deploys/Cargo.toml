[package]
name        = "ratatoskr-sites-deploys"
description = "The deploy receipt, the deploy store and the activation of the static bundles of a site."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[features]
# Mandatory manual acceptance with the real pinned public proof and installed tools.
real-proof-tests = []

[dependencies]
ratatoskr-sites-contracts.workspace   = true
ratatoskr-sites-persistence.workspace = true
serde.workspace                       = true
serde_json.workspace                  = true
sha2.workspace                        = true
sqlx.workspace                        = true
tar.workspace                         = true
thiserror.workspace                   = true
tokio.workspace                       = true
tokio-util                            = { workspace = true, features = ["io-util"] }
tracing.workspace                     = true
unicode-normalization.workspace       = true
uuid.workspace                        = true
nix.workspace                         = true

[dev-dependencies]
ratatoskr-sites-persistence = { workspace = true, features = ["test-support"] }
sha2.workspace              = true
tempfile.workspace          = true
tokio                       = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

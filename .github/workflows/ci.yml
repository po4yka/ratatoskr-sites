# The gate DEVELOPMENT.md documents, enforced. The command list here and the command list in
# DEVELOPMENT.md are the same list; if they drift, DEVELOPMENT.md is wrong.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly on main, so a date-dependent test or a runner change is caught without a push.
    - cron: "17 5 * * 1"

# SECURITY.md: deny by default. The gate reads the tree and needs nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On a pull request only the newest push matters, so a superseded run is cancelled. On `main` a
  # cancelled run leaves that commit with no verdict, so runs on `main` are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The integration suite talks to a real PostgreSQL on purpose: the persistence layer uses
    # runtime-checked queries, so this suite is what verifies them.
    services:
      postgres:
        # Pinned by digest, not by tag. `postgres:17` as it stood on 2026-08-19 (PostgreSQL 17.11),
        # byte-identical to ratatoskr-platform/ci.yml and ratatoskr-vault/ci.yml.
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_USER: sites
          POSTGRES_PASSWORD: sites
          POSTGRES_DB: sites
          # Byte-identical to compose.yaml, so the runner and a laptop sort text the same way.
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sites -d sites"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

    env:
      # Where the suite creates and drops its disposable databases. Matches compose.yaml, so the
      # same command works on a laptop and here.
      SITES_TEST_DATABASE_URL: postgres://sites:sites@127.0.0.1:5432/sites
      # The JetStream server of the outbox relay test (tests/outbox_relay.rs), started below.
      SITES_TEST_NATS_URL: nats://127.0.0.1:4222

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate reads the tree and pushes nothing, so the checkout credential is not kept.
          persist-credentials: false

      - name: Show the pinned toolchain
        run: rustup show           # rust-toolchain.toml is the only supported toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Start disposable JetStream
        run: |
          # A service container cannot pass `-js`, so the broker is started as a step. The digest is
          # `nats:2.15.0-alpine` as it stood on 2026-10-10, byte-identical to ratatoskr-claude/ci.yml.
          docker run -d --name sites-ci-nats \
            -p 127.0.0.1:4222:4222 \
            nats@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4 \
            -js
          for attempt in $(seq 1 30); do
            if bash -c 'exec 3<>/dev/tcp/127.0.0.1/4222'; then
              exit 0
            fi
            sleep 1
          done
          docker logs sites-ci-nats
          exit 1

      - run: cargo fetch --locked

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The one size limit clippy cannot express: no Rust lint counts the lines in a file. The
      # number is the fleet ratchet from ratatoskr-workspace/docs/QUALITY_GATES.md. `*.rs` only, so
      # Cargo.lock and schema.sql need no exclusion list.
      - run: git ls-files -z "*.rs" | xargs -0 -r wc -l | awk '$2 != "total" && $1 > 850 { print; bad = 1 } END { exit bad }'

      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --release

      # This file and DEVELOPMENT.md are one list by rule, and this step enforces the rule. The awk
      # reads only the `gate` job: a top-level job key is a bare name at two spaces.
      - name: The gate and DEVELOPMENT.md are one list
        run: |
          set -euo pipefail
          in_ci=$(awk '
            /^  [a-z][a-z0-9_-]*:[[:space:]]*$/ { in_gate = ($0 ~ /^  gate:[[:space:]]*$/) }
            in_gate && /^[[:space:]]+- run: cargo / { sub(/^[[:space:]]+- run: /, ""); print }
          ' .github/workflows/ci.yml)
          in_doc=$(awk '/^### Rust — also the CI gate/{f=1} f&&/^cargo /{print} f&&/^```$/{exit}' \
                   DEVELOPMENT.md)
          if [ "$in_ci" != "$in_doc" ]; then
            echo "::error::ci.yml and DEVELOPMENT.md have drifted. DEVELOPMENT.md is the one that is wrong."
            diff <(echo "$in_ci") <(echo "$in_doc") || true
            exit 1
          fi
          echo "the two lists are identical:"
          echo "$in_ci" | awk '{print "  " $0}'

  # Separate from the gate, so a new RustSec advisory cannot hide a clippy or test failure.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the pinned toolchain
        run: rustup show           # rust-toolchain.toml is the only supported toolchain

      # Reads RustSec, the licence set, duplicate versions and the source policy.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny
      - run: cargo deny check

  artifact:
    name: linux/arm64 artifact
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: |
          docker build \
            --build-arg RATATOSKR_GIT_SHA="$GITHUB_SHA" \
            --tag ratatoskr-sites:ci .

      # The deployable set, exactly. `export` is the stage `ratatoskr-workspace`'s
      # reusable-release-artifact workflow publishes; its check refuses a binary no unit starts as
      # firmly as a missing one.
      - name: The export stage holds exactly the Sites service, for aarch64
        run: |
          set -euo pipefail
          docker buildx build \
            --target export \
            --build-arg RATATOSKR_GIT_SHA="$GITHUB_SHA" \
            --output "type=local,dest=$RUNNER_TEMP/export" .
          actual=$(python3 -c 'import os, sys; print(" ".join(sorted(os.listdir(sys.argv[1]))))' "$RUNNER_TEMP/export")
          if [ "$actual" != "ratatoskr-sites" ]; then
            echo "::error::the export stage holds '$actual', expected 'ratatoskr-sites'"
            exit 1
          fi
          file "$RUNNER_TEMP/export/ratatoskr-sites" | tee /dev/stderr | grep -q 'ARM aarch64'

      # Start, ready, SIGTERM, exit 0, against the real artifact. Sites applies its own `schema.sql`;
      # without RATATOSKR__BUS__URL it connects to no bus. `--network host` for both, so every
      # address is 127.0.0.1 as in the unit.
      - name: The artifact serves and stops cleanly
        run: |
          set -euo pipefail
          docker run -d --name smoke-db --network host \
            -e POSTGRES_USER=sites -e POSTGRES_PASSWORD=sites -e POSTGRES_DB=sites \
            -e POSTGRES_INITDB_ARGS="--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8" \
            postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
          for _ in $(seq 1 60); do
            if docker exec smoke-db pg_isready -h 127.0.0.1 -U sites -d sites >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          cat > "$RUNNER_TEMP/smoke.env" <<'ENV'
          RATATOSKR__ADMIN__BIND=127.0.0.1:9472
          RATATOSKR__API__LISTEN_ADDRESS=127.0.0.1:8100
          RATATOSKR__DATABASE__URL=postgres://sites:sites@127.0.0.1:5432/sites
          ENV
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/smoke.env"
          docker run --rm --network host --env-file "$RUNNER_TEMP/smoke.env" \
            ratatoskr-sites:ci check-config 2>/dev/null
          docker run -d --name smoke --network host --env-file "$RUNNER_TEMP/smoke.env" \
            ratatoskr-sites:ci
          ready=no
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9472/health/ready >/dev/null; then ready=yes; break; fi
            sleep 1
          done
          if [ "$ready" != yes ]; then
            docker logs smoke >&2
            echo "::error::Sites did not report ready within 60 s"
            exit 1
          fi
          present=$(docker exec smoke-db psql -U sites -d sites -Atc \
            "select to_regclass('sites.releases') is not null")
          if [ "$present" != "t" ]; then
            echo "::error::sites.releases is absent after Sites reported itself ready"
            exit 1
          fi
          docker stop -t 40 smoke
          code=$(docker inspect -f '{{.State.ExitCode}}' smoke)
          if [ "$code" != 0 ]; then
            docker logs smoke >&2
            echo "::error::Sites exited $code after SIGTERM"
            exit 1
          fi
          docker rm -f smoke smoke-db

  # The artifact of this commit, published only after the gate and the arm64 smoke test have passed
  # on it: `ghcr.io/po4yka/ratatoskr-sites:sha-<commit>` with SHA256SUMS, an SPDX SBOM and a
  # build-provenance attestation. The steps live once, in ratatoskr-workspace (openspec
  # `release-artifacts`). A tag that already exists is never moved.
  release-artifact:
    needs: [gate, artifact]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # the OIDC token the attestation is signed with
      attestations: write  # record the attestation against this repository
    uses: po4yka/ratatoskr-workspace/.github/workflows/reusable-release-artifact.yml@75b3ed8cb5f1e0bd638db99126f887b65fa73eb8 # main
